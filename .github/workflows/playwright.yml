name: 🎭 Run Tests for Management

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to test?'
        required: true
        default: 'qa'
        type: choice
        options:
        - qa
        - dev  
        - prod
      browser:
        description: 'Which browser to test?'
        required: true
        default: 'chromium'
        type: choice
        options:
        - chromium
        - firefox
        - webkit
        - all

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-tests:
    name: 🧪 Execute Tests & Generate Reports
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 📋 Install Dependencies
        run: npm ci
        
      - name: 🎭 Install Playwright Browsers
        run: |
          if [ "${{ github.event.inputs.browser }}" = "all" ]; then
            npx playwright install --with-deps
          else
            npx playwright install --with-deps ${{ github.event.inputs.browser }}
          fi
        
      - name: ⚙️ Configure Environment
        run: |
          echo "ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "HEADLESS=true" >> $GITHUB_ENV
          echo "CI=true" >> $GITHUB_ENV
          echo "RETRIES=1" >> $GITHUB_ENV
          echo "WORKERS=2" >> $GITHUB_ENV
          
      - name: 🔑 Setup CAPTCHA Bypass
        run: |
          if [ -n "${{ secrets.AUTOMATION_SECRET }}" ]; then
            echo "✅ CAPTCHA bypass enabled"
            echo "AUTOMATION_SECRET=${{ secrets.AUTOMATION_SECRET }}" >> $GITHUB_ENV
          else
            echo "⚠️ CAPTCHA bypass disabled - tests may fail on CAPTCHA steps"
          fi
          
      - name: 🧪 Run Tests
        run: |
          echo "🚀 Running tests on ${{ github.event.inputs.environment }} environment with ${{ github.event.inputs.browser }}"
          if [ "${{ github.event.inputs.browser }}" = "all" ]; then
            npx playwright test --reporter=list,allure-playwright,html
          else
            npx playwright test --project=${{ github.event.inputs.browser }} --reporter=list,allure-playwright,html
          fi
        env:
          ENV: ${{ github.event.inputs.environment }}
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          
      - name: 📊 Generate Allure Report
        if: always()
        run: |
          npm install -g allure-commandline
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found, skipping allure report generation"
            mkdir -p allure-report
            echo "<h1>No Allure results generated</h1>" > allure-report/index.html
          fi
          
      - name: 📋 Create Management Summary
        if: always()
        run: |
          echo "# 📊 Test Execution Summary for Management" > EXECUTIVE_SUMMARY.md
          echo "" >> EXECUTIVE_SUMMARY.md
          echo "**Date:** $(date)" >> EXECUTIVE_SUMMARY.md
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> EXECUTIVE_SUMMARY.md
          echo "**Browser:** ${{ github.event.inputs.browser }}" >> EXECUTIVE_SUMMARY.md
          echo "**Triggered by:** ${{ github.actor }}" >> EXECUTIVE_SUMMARY.md
          echo "" >> EXECUTIVE_SUMMARY.md
          echo "## 📈 How to View Results" >> EXECUTIVE_SUMMARY.md
          echo "1. Download this artifact" >> EXECUTIVE_SUMMARY.md
          echo "2. Extract the zip file" >> EXECUTIVE_SUMMARY.md
          echo "3. Open **allure-report/index.html** in your browser" >> EXECUTIVE_SUMMARY.md
          echo "4. View the beautiful dashboard with pass/fail percentages" >> EXECUTIVE_SUMMARY.md
          echo "" >> EXECUTIVE_SUMMARY.md
          echo "## 📊 What's Included" >> EXECUTIVE_SUMMARY.md
          echo "- 📈 **allure-report/** - Interactive dashboard with charts" >> EXECUTIVE_SUMMARY.md
          echo "- 📝 **playwright-report/** - Detailed test results" >> EXECUTIVE_SUMMARY.md
          echo "- 🐛 **test-results/** - Screenshots and videos of failures" >> EXECUTIVE_SUMMARY.md
          
      - name: 📤 Upload Management Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 📊-MANAGEMENT-REPORT-${{ github.event.inputs.environment }}-${{ github.event.inputs.browser }}
          path: |
            allure-report/
            playwright-report/
            test-results/
            EXECUTIVE_SUMMARY.md
          retention-days: 30